name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Hosted runners have no GPU, so this builds and tests the core (scheduler,
    # paged KV manager, clock policy, telemetry, reporting) without llama.cpp/NVML.
    name: core (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
    steps:
      - uses: actions/checkout@v5
      # libstdc++ only exposes std::expected when __cpp_concepts >= 202002 (Clang 19+).
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-19
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DAVIS_WITH_LLAMA=OFF -DAVIS_WITH_NVML=OFF
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE integration
      - name: Micro-benchmarks (smoke)
        run: ./build/bench/avis_micro_bench --benchmark_min_time=0.01s
